# dav1d-fullgrain: add to ~/.config/mpv/mpv.conf (Linux and macOS)
#
# The fork only makes a difference when dav1d decodes AV1 and draws the grain:
# - AV1 must be decoded in software. This keeps hardware decoding for every
#   other codec (mpv 0.41's default list without av1).
hwdec-codecs=h264,vc1,hevc,vp8,vp9,prores,prores_raw,ffv1,dpx
# - Grain must be applied by the decoder, not by mpv's GPU renderer
#   (vo=gpu-next would otherwise draw standard AV1 grain itself).
vd-lavc-film-grain=cpu
