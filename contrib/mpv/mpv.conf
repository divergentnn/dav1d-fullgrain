# dav1d-fullgrain: add to ~/.config/mpv/mpv.conf (Linux and macOS)
#
# The fork only makes a difference when dav1d decodes the AV1. With hardware
# decoding (Macs with M3 or later, most recent PC GPUs, if hwdec is on) it
# isn't used at all. This keeps AV1 in software and every other codec in
# hardware (mpv 0.41's default list without av1):
hwdec-codecs=h264,vc1,hevc,vp8,vp9,prores,prores_raw,ffv1,dpx
#
# Not needed with the fork's default grain_force: with vo=gpu-next, mpv asks the
# decoder to leave grain out and draws standard AV1 grain on the GPU; the fork
# applies full-frame grain anyway and hides the grain parameters from mpv.
# With DAV1D_GRAIN_FORCE=0 you would need:
#vd-lavc-film-grain=cpu
