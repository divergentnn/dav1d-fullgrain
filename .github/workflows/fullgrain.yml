name: fullgrain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86-64: AVX2 kernels
            name: linux-x86_64
          - os: macos-14        # Apple Silicon: NEON kernels
            name: macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Build dav1d-fullgrain
        run: |
          meson setup build --buildtype=release -Denable_tools=true -Denable_tests=false
          ninja -C build
          build/tools/dav1d --version

      - name: Build upstream dav1d 1.5.4 (reference)
        run: |
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d.git upstream
          meson setup upstream/build upstream --buildtype=release -Denable_tools=true -Denable_tests=false
          ninja -C upstream/build

      - name: Test (standard == upstream, SIMD == C, cross-platform hashes)
        run: sh tests/fullgrain/run.sh build/tools/dav1d upstream/build/tools/dav1d

      - name: av1grain strip (grain-free stream + params == original)
        run: |
          sh tests/fullgrain/strip.sh build/tools/av1grain
          python3 tools/av1grain_mp4.py --help >/dev/null

      - name: Timing
        run: sh tests/fullgrain/timing.sh build/tools/dav1d

      - name: av1-grain-seed (containers, edits, determinism; parser and edits vs libdav1d)
        run: |
          meson test -C build --suite av1fg --suite av1fg-dav1d --print-errorlogs
          build/tools/av1fg/av1-grain-seed --analyze tests/fullgrain/timing_720p_10bit_fgt03.ivf

      - name: C-only build (no asm, no SIMD kernels) and grain_mode_default=standard
        if: runner.os == 'Linux'
        run: |
          meson setup build-noasm --buildtype=release -Denable_tools=true -Denable_tests=false \
            -Denable_asm=false -Dgrain_mode_default=standard
          ninja -C build-noasm
          DEFAULT_MODE=standard sh tests/fullgrain/run.sh build-noasm/tools/dav1d upstream/build/tools/dav1d

  # av1-grain-seed on Windows (MSVC): the tool and its container/edit tests
  # (the libdav1d cross-checks run on Linux and macOS)
  av1-grain-seed-windows:
    name: windows-x86_64 (av1-grain-seed, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install meson ninja

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build av1-grain-seed
        run: |
          meson setup build --buildtype=release -Denable_asm=false -Denable_tools=false -Denable_tests=false
          ninja -C build tools/av1fg/av1-grain-seed.exe

      - name: Test
        run: |
          meson test -C build --suite av1fg --no-rebuild --print-errorlogs
          build/tools/av1fg/av1-grain-seed.exe --analyze tests/fullgrain/timing_720p_10bit_fgt03.ivf
