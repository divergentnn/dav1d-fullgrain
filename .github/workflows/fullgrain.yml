name: fullgrain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86-64: AVX2 kernels
            name: linux-x86_64
          - os: macos-14        # Apple Silicon: NEON kernels
            name: macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Build dav1d-fullgrain
        run: |
          meson setup build --buildtype=release -Denable_tools=true -Denable_tests=false
          ninja -C build
          build/tools/dav1d --version

      - name: Build upstream dav1d 1.5.4 (reference)
        run: |
          git clone --depth 1 --branch 1.5.4 https://code.videolan.org/videolan/dav1d.git upstream
          meson setup upstream/build upstream --buildtype=release -Denable_tools=true -Denable_tests=false
          ninja -C upstream/build

      - name: Test (standard == upstream, SIMD == C, cross-platform hashes)
        run: sh tests/fullgrain/run.sh build/tools/dav1d upstream/build/tools/dav1d

      - name: Timing
        run: sh tests/fullgrain/timing.sh build/tools/dav1d

      - name: C-only build (no asm, no SIMD kernels) and grain_mode_default=standard
        if: runner.os == 'Linux'
        run: |
          meson setup build-noasm --buildtype=release -Denable_tools=true -Denable_tests=false \
            -Denable_asm=false -Dgrain_mode_default=standard
          ninja -C build-noasm
          DEFAULT_MODE=standard sh tests/fullgrain/run.sh build-noasm/tools/dav1d upstream/build/tools/dav1d
